name: Prepare release

# Tags prepare Actions artifacts only. A manually approved run
# may create a draft; publishing that draft remains a separate maintainer action.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.1.0)
        type: string
        required: true
      signed:
        description: Use Developer ID signing and Apple notarization
        type: boolean
        default: false
      include_dmg:
        description: Also create a DMG
        type: boolean
        default: true
      create_draft:
        description: Create a GitHub draft release after all checks
        type: boolean
        default: false
      manual_validation_complete:
        description: I have reviewed the source and completed the release checklist
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Verify and package
    runs-on: macos-26
    timeout-minutes: 60
    environment: ${{ inputs.signed && 'apple-release' || 'development-build' }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      SIGNED_BUILD: ${{ inputs.signed || false }}
      INCLUDE_DMG: ${{ github.event_name == 'push' || inputs.include_dmg }}
      MANUAL_VALIDATION_COMPLETE: ${{ inputs.manual_validation_complete || false }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}

    steps:
      - name: Check out the selected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the tag and release intent
        id: version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected an existing vMAJOR.MINOR.PATCH tag.' >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ "$SIGNED_BUILD" == true && "$MANUAL_VALIDATION_COMPLETE" != true ]]; then
            echo 'Signing requires a manual run with the release checklist confirmed.' >&2
            exit 1
          fi
          mode=development
          if [[ "$SIGNED_BUILD" == true ]]; then mode=notarized; fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "artifact_name=eave-$RELEASE_TAG-$mode" >> "$GITHUB_OUTPUT"
          test -d "$DEVELOPER_DIR"
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version

      - name: Import release credentials into a temporary keychain
        if: inputs.signed
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          for required in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD SIGNING_IDENTITY NOTARY_KEY_BASE64 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [[ -z "${!required}" ]]; then
              echo "Missing the $required release secret; signed builds never fall back to ad-hoc signing." >&2
              exit 1
            fi
          done
          umask 077
          keychain_path="$RUNNER_TEMP/eave-release.keychain-db"
          keychain_password="$(uuidgen)"
          printf '::add-mask::%s\n' "$keychain_password"
          printf '%s' "$CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$RUNNER_TEMP/eave-certificate.p12"
          printf '%s' "$NOTARY_KEY_BASE64" | /usr/bin/base64 -D > "$RUNNER_TEMP/eave-notary-key.p8"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$RUNNER_TEMP/eave-certificate.p12" -k "$keychain_path" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path" > /dev/null
          security list-keychains -d user -s "$keychain_path"
          xcrun notarytool store-credentials EaveCI --key "$RUNNER_TEMP/eave-notary-key.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --keychain "$keychain_path" > /dev/null
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo 'NOTARY_PROFILE=EaveCI' >> "$GITHUB_ENV"
          echo "NOTARY_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Test, build, package, and validate
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.tag }}
        run: |
          arguments=()
          if [[ "$SIGNED_BUILD" == true ]]; then arguments+=(--signed); fi
          if [[ "$INCLUDE_DMG" == true ]]; then arguments+=(--dmg); fi
          ./Scripts/release.sh "${arguments[@]}"

      - name: Prepare release notes
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ['RELEASE_TAG'][1:]
          changelog = pathlib.Path('CHANGELOG.md').read_text()
          match = re.search(r'^## \[' + re.escape(version) + r'\][^\n]*\n(.*?)(?=^## |\Z)', changelog, re.M | re.S)
          if not match:
              raise SystemExit('Add a changelog entry for the exact release version before packaging.')
          distribution = ('Developer ID signed and notarized.' if os.environ['SIGNED_BUILD'] == 'true'
                          else 'Ad-hoc signed development build. Not Developer ID signed or notarized; downloaded copies may be blocked by Gatekeeper.')
          notes = f"# Eave {os.environ['RELEASE_TAG']}\n\n{distribution}\n\n" + match.group(1).strip()
          notes += '\n\nBuild and automated tests ran on hosted macOS 26 / arm64. Visual menu-bar behavior and macOS 27 runtime require the documented manual checks.\n'
          pathlib.Path('dist/RELEASE_NOTES.md').write_text(notes)
          PY

      - name: Upload prepared assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload release notes separately from distributable assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.version.outputs.artifact_name }}-notes
          path: dist/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always() && inputs.signed
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/eave-release.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/eave-release.keychain-db" || cleanup_status=$?
          fi
          rm -f -- "$RUNNER_TEMP/eave-certificate.p12" "$RUNNER_TEMP/eave-notary-key.p8"
          exit "${cleanup_status:-0}"

  draft:
    name: Prepare an approved draft
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.create_draft && inputs.manual_validation_complete
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-review
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.package.outputs.tag }}
    steps:
      - name: Download this run's verified assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: release-assets

      - name: Check asset checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt

      - name: Download this run's release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.package.outputs.artifact_name }}-notes
          path: release-metadata

      - name: Create a draft, without publishing
        shell: bash
        run: |
          shopt -s nullglob
          assets=(release-assets/*.zip release-assets/*.dmg release-assets/SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --draft --title "Eave $RELEASE_TAG" --notes-file release-metadata/RELEASE_NOTES.md
