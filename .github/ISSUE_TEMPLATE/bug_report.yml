name: Bug report
description: Report a reproducible problem with Eave.
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, follow SECURITY.md instead of opening a public report.
        Remove personal data from logs and screenshots. Do not attach recovery.json, original wallpapers, full home-directory paths, or signing credentials.
  - type: input
    id: version
    attributes:
      label: Eave version and installation method
      placeholder: Version from About Eave; downloaded archive or source build
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: For example, 27.0.1
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Mac model, architecture, and displays
      description: Include Retina/scaling and external-display details; omit serial numbers.
      placeholder: MacBook Pro, Apple Silicon arm64, built-in notched display
    validations:
      required: true
  - type: dropdown
    id: wallpaper
    attributes:
      label: Wallpaper type
      options:
        - Local static image
        - Dynamic or Light/Dark HEIC
        - Aerial / Golden Gate / video
        - Other system-managed wallpaper
        - Unknown
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include Fill/Fit/Center, appearance, Spaces/full-screen, and auto-hide when relevant.
      placeholder: |
        1. Select ...
        2. Enable Eave ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include Eave's displayed message and whether disabling restores the original wallpaper.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs and screenshots
      description: Optional. Redact account names, paths, private notifications, and personal desktop content.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed personal data and checked the documented wallpaper limitations.
          required: true
